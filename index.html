<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Pictionary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Welcome to Multiplayer Pictionary!</h1>
  </header>
  <main>
    <section id="auth-section">
      <h2>Authentication</h2>
      <div id="auth-controls">
        <input id="email-input" type="email" placeholder="Email" />
        <input id="password-input" type="password" placeholder="Password" />
        <button id="login-button">Login</button>
        <button id="signup-button">Sign Up</button>
        <p id="auth-error" class="error hidden"></p>
        <button id="logout-button" class="hidden">Logout</button>
      </div>
      <p id="auth-status">Not logged in.</p>
    </section>
    <section id="game-setup" class="hidden">
      <h2>Game Setup</h2>
      <button id="create-room">Create Room</button>
      <button id="join-room">Join Room</button>
      <div id="room-controls" class="hidden">
        <input id="room-name" type="text" placeholder="Enter room name or code" />
        <button id="confirm-room">Confirm</button>
      </div>
      <p id="room-code-display"></p>
    </section>
  </main>
